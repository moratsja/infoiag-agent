[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "infoiag-agent"
version = "0.1.0"
requires-python = ">=3.10,<3.15"
dependencies = [
    "langgraph>=0.2.60",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "owlready2>=0.46",
    "rdflib>=7.0.0",
    "pydantic>=2",
    "python-dotenv>=1.0.0",
]

[tool.setuptools]
packages = []
